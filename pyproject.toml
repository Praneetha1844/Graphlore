[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphlore"
version = "0.1.0"
description = "Knowledge-graph builder with provenance and bounded multi-hop question answering."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Praneetha Potharaju" }]
dependencies = ["networkx>=3.2", "pydantic>=2.6", "pyyaml>=6"]

[project.optional-dependencies]
spacy = ["spacy>=3.7"]
neo4j = ["neo4j>=5.20"]
pdf = ["pypdf>=4"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "pre-commit>=3.7",
       "types-PyYAML"]

[project.scripts]
graphlore = "graphlore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = ["src"]
